name: Build unified actual-video covers
on:
  push:
    paths:
      - '.github/workflows/video-preview-frames.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install video frame extraction
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet Pillow requests
      - name: Export authentic video frames and official podcast thumbnail
        run: |
          python3 - <<'PY'
          import os,subprocess,io,requests
          from PIL import Image, ImageEnhance
          os.makedirs('assets/video-previews',exist_ok=True)
          # The chosen positions were visually reviewed in 6-frame contact sheets of the actual source videos.
          selections=[
              ('yorini-hongkong.mp4','yorini-hongkong-cover.webp',187.3),
              ('yorini-tv.mp4','yorini-tv-cover.webp',226.0),
          ]
          for src,out,seconds in selections:
              inputfile=f'assets/{src}'
              outputfile=f'assets/video-previews/{out}'
              tmp='/tmp/'+out.replace('.webp','.png')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(seconds),'-i',inputfile,'-frames:v','1','-vf','scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=black',tmp],check=True)
              im=Image.open(tmp).convert('RGB')
              im.save(outputfile,'WEBP',quality=93,method=6)
              print(outputfile,im.size,os.path.getsize(outputfile))
          # The real Youtube video artwork (not an AI substitute), locally cached to avoid hotlink changes.
          yt='SaRoqLR8QxE'
          for res in ('maxresdefault','hqdefault'):
              try:
                  response=requests.get(f'https://i.ytimg.com/vi/{yt}/{res}.jpg',timeout=18,headers={'User-Agent':'Mozilla/5.0'})
                  response.raise_for_status()
                  im=Image.open(io.BytesIO(response.content)).convert('RGB')
                  if im.width<300: continue
                  if im.width<1280:
                      im=im.resize((1280,round(im.height*1280/im.width)),Image.Resampling.LANCZOS)
                  from PIL import ImageOps
                  im=ImageOps.fit(im,(1280,720),method=Image.Resampling.LANCZOS,centering=(.5,.5))
                  out='assets/video-previews/martin-podcast-cover.webp'
                  im.save(out,'WEBP',quality=92,method=6)
                  print(out,im.size,os.path.getsize(out))
                  break
              except Exception as e:
                  print('thumbnail source issue:',res,str(e)[:150])
          PY
      - name: Commit new actual-video cover images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video-previews/*-cover.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add actual footage thumbnails for three unified video covers"
            git push
          fi
